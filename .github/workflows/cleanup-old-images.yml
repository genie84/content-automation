name: Cleanup Old Images

# 'Migrate Images to GitHub'가 성공으로 기록한 옛 워드프레스 미디어 중, 지금도 어디에서도 안 쓰이고 새 주소가
# 정상적으로 열리는 것만 삭제한다. 수동 실행 전용.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: image-migration
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python -m scripts.migrate_images --cleanup
        env:
          PYTHONUNBUFFERED: "1"
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}

      - name: 이전 기록 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/migration
          git diff --cached --quiet || (git commit -q -m "chore: 이미지 정리 기록" && git pull -q --rebase origin main && git push -q origin main)
