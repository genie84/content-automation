name: Daily Content Pipeline

on:
  schedule:
    - cron: "45 22 * * *"  # 07:45 KST
    - cron: "0 1 * * *"    # 10:00 KST
    - cron: "0 5 * * *"    # 14:00 KST
    - cron: "0 10 * * *"   # 19:00 KST
  workflow_dispatch: {}

permissions:
  contents: write

# 서버 크론이 정시에 직접 시작시킨 실행과 늦게 도착한 예약 실행이 겹쳐도 같은 영상을 두 번 발행하지 않게 직렬화한다
# (앞 실행이 seen_videos를 커밋한 뒤에 다음 실행이 체크아웃한다). 모음글 워크플로우와도 같은 그룹.
concurrency:
  group: video-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium (+ OS deps)
        run: playwright install --with-deps chromium

      - run: python main.py
        timeout-minutes: 25
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          IMAGE_HOST_TOKEN: ${{ secrets.IMAGE_HOST_TOKEN }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update pipeline state (seen videos / model cache)"
          file_pattern: "data/seen_videos.json data/resolved_model.json data/naver_queue/ data/today_video_posts.json data/today_video_posts/"
