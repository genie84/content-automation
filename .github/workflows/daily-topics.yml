name: Daily Topic-Selection Pipeline

# 삼프로TV 영상 트랙(daily-post.yml)과 완전히 별개 스케줄.
# 2026-09-22: GitHub 예약 실행이 최대 ~4시간 늦게 도는 것이 확인돼(09/19~ 09:00 예약이 13시경 실행),
# 지연돼도 오전 중에 끝나도록 06:23 KST = 21:23 UTC(전날)로 앞당겼다. 정각(:00)은 GitHub 부하가 몰려
# 지연이 특히 크므로 분도 어긋나게 잡았다. 하루 1회 게이팅(topic_track_state.json)은 KST 날짜 기준이라 안전.
on:
  schedule:
    - cron: "23 21 * * *"  # 06:23 KST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium (+ OS deps)
        run: playwright install --with-deps chromium

      - run: python main.py --topics
        timeout-minutes: 25
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          IMAGE_HOST_TOKEN: ${{ secrets.IMAGE_HOST_TOKEN }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update topic track state (history / model cache)"
          file_pattern: "data/topic_history.json data/topic_track_state.json data/resolved_model.json data/naver_queue/ data/digest_publish_count.json"
